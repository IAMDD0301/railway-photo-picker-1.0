<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>旅拍駅 — 全台鐵路車站隨機旅拍系統</title>
  <!-- 導入 Google 圓體備用字型與樣式表 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">
    <!-- 日系Header區 -->
    <header class="main-header">
      <div class="brand">
        <span class="badge">TRAIL & SHOT</span>
        <h1>旅拍駅 <span>車站抽選系統</span></h1>
      </div>
      <div class="stats-bar">
        <div class="stat-item">剩餘站點：<strong id="remaining-count">--</strong> / <span id="total-count">--</span></div>
        <div class="stat-item">已造訪：<strong id="visited-count">0</strong></div>
        <button id="btn-history" class="btn-icon">📜 旅途日誌</button>
      </div>
    </header>

    <!-- 核心翻轉式時刻表看板 (Flip Board) -->
    <main class="drawing-stage">
      <div class="flip-board-container">
        <div class="board-header">
          <span class="board-title">▲ 下一站目的地 ▲</span>
          <span class="status-indicator">STANDBY</span>
        </div>
        
        <div class="flip-board">
          <!-- 路線欄位 -->
          <div class="flip-column">
            <span class="column-label">LINE 路線</span>
            <div class="flip-card" id="flip-line">
              <div class="flip-inner">——</div>
            </div>
          </div>

          <!-- 代碼欄位 -->
          <div class="flip-column">
            <span class="column-label">CODE 代碼</span>
            <div class="flip-card" id="flip-code">
              <div class="flip-inner">0000</div>
            </div>
          </div>

          <!-- 車站名稱欄位 -->
          <div class="flip-column main-station">
            <span class="column-label">STATION 車站</span>
            <div class="flip-card" id="flip-name">
              <div class="flip-inner">ready</div>
            </div>
          </div>
        </div>
      </div>

      <!-- 核心快門抽選按鈕 -->
      <div class="action-area">
        <button id="btn-draw" class="shutter-button">
          <span class="camera-icon">📸</span>
          <span class="btn-text">按下快門抽選</span>
        </button>
      </div>
    </main>
  </div>

  <!-- 彈出式車站寫真卡片 (Result Modal) -->
  <div id="result-modal" class="modal-overlay hidden">
    <div class="polaroid-card">
      <button id="btn-close-modal" class="btn-close">×</button>
      
      <!-- 照片區 -->
      <div class="polaroid-photo">
        <img id="modal-photo" src="" alt="車站風景">
        <span class="photo-tag" id="modal-tag">宜蘭線 | 招呼站</span>
      </div>

      <!-- 文字與推薦區 -->
      <div class="polaroid-caption">
        <h2 id="modal-station-title">石城火車站</h2>
        <p class="location-text" id="modal-location">📍 宜蘭縣頭城鎮</p>
        
        <div class="info-section">
          <h3>📷 周邊拍攝地點</h3>
          <ul id="modal-photo-spots"></ul>
        </div>

        <div class="info-section">
          <h3>🍜 在地簡易美食</h3>
          <ul id="modal-food-spots"></ul>
        </div>
      </div>
    </div>
  </div>

  <!-- 歷史紀錄側邊欄 (History Modal) -->
  <div id="history-modal" class="modal-overlay hidden">
    <div class="history-panel">
      <div class="panel-header">
        <h2>📜 旅途日誌 (已造訪車站)</h2>
        <button id="btn-close-history" class="btn-close">×</button>
      </div>
      <ul id="history-list" class="history-list"></ul>
      <div class="panel-footer">
        <button id="btn-reset" class="btn-danger">🔄 重置造訪紀錄（重新環島）</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
